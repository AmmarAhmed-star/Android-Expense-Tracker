<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Expense Tracker 💰 - Ammar Ahmed</title>
<style>
*{box-sizing:border-box}body{font-family:'Segoe UI',Arial;margin:0;background:#f0f2ff}
.hero{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;padding:32px 20px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.hero h1{font-size:32px;margin:0}.hero p{opacity:.9}
.wrap{max-width:900px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 20px rgba(0,0,0,.08);border-left:6px solid #ff6b6b}
button{background:linear-gradient(90deg,#ff6b6b,#ffa502);color:#fff;border:0;padding:12px 18px;border-radius:999px;margin:5px;cursor:pointer;font-weight:700;box-shadow:0 4px 12px rgba(255,107,107,.4)}
button.blue{background:linear-gradient(90deg,#4facfe,#00f2fe)}button.green{background:linear-gradient(90deg,#43e97b,#38f9d7)}button.purple{background:linear-gradient(90deg,#a18cd1,#fbc2eb);color:#333}
input,select,textarea{padding:12px;margin:5px;border:2px solid #e5e7eb;border-radius:12px;width:92%;font-size:15px}
.bar{display:inline-block;width:28px;margin:2px;border-radius:8px 8px 0 0;text-align:center;color:#fff;font-weight:700}
.pill{display:inline-block;padding:6px 12px;border-radius:999px;background:#fff3cd;margin:3px;font-size:13px;font-weight:700}
.badge{background:#ff4757;color:#fff;padding:4px 10px;border-radius:999px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class='hero'><div style='font-size:52px'>💰</div><h1>Expense Tracker 💰</h1><p>By Ammar Ahmed | Live on GitHub Pages | Made with ❤️</p><div><span class='pill'>🔥 LIVE</span><span class='pill'>⭐ 4.8 Rating</span><span class='pill'>🚀 2026</span></div></div>
<div class='wrap'><div class='card'><h2>💳 Balance: Rs <span id='bal'>12450</span></h2><p>🟢 Income 25000 | 🔴 Expense <span id='exp'>12550</span></p><input id='t' placeholder='Title: Chai, Petrol...'><input id='a' type='number' placeholder='Amount'><select id='c'><option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option></select><button onclick='add()'>Add Expense +</button><div id='list'></div></div></div><script>let items=[{t:'Chai',a:20,c:'Food'},{t:'Petrol',a:500,c:'Travel'},{t:'Groceries',a:1200,c:'Shopping'}];function render(){document.getElementById('list').innerHTML=items.map((x,i)=>`<p>🍔 ${x.t} - Rs ${x.a} [${x.c}] <button onclick='del(${i})'>Delete</button></p>`).join('');let e=items.reduce((s,x)=>s+x.a,0);document.getElementById('exp').innerText=e;document.getElementById('bal').innerText=25000-e;}function add(){let t=document.getElementById('t').value,a=+document.getElementById('a').value,c=document.getElementById('c').value;if(!t||!a)return;items.push({t,a,c});render();}function del(i){items.splice(i,1);render();}render();</script></body></html>
