<!DOCTYPE html><html><head><link rel="stylesheet" href="expense-tracker.css">
<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Expense Tracker 💰 - Ammar Ahmed</title>
</head><body>
<div class='hero'><div style='font-size:52px'>💰</div><h1>Expense Tracker 💰</h1><p>By Ammar Ahmed | Live on GitHub Pages | Made with ❤️</p><div><span class='pill'>🔥 LIVE</span><span class='pill'>⭐ 4.8 Rating</span><span class='pill'>🚀 2026</span></div></div>
<div class='wrap'><div class='card'><h2>💳 Balance: Rs <span id='bal'>12450</span></h2><p>🟢 Income 25000 | 🔴 Expense <span id='exp'>12550</span></p><input id='t' placeholder='Title: Chai, Petrol...'><input id='a' type='number' placeholder='Amount'><select id='c'><option>Food</option><option>Travel</option><option>Shopping</option><option>Bills</option></select><button onclick='add()'>Add Expense +</button><div id='list'></div></div></div><script>let items=[{t:'Chai',a:20,c:'Food'},{t:'Petrol',a:500,c:'Travel'},{t:'Groceries',a:1200,c:'Shopping'}];function render(){document.getElementById('list').innerHTML=items.map((x,i)=>`<p>🍔 ${x.t} - Rs ${x.a} [${x.c}] <button onclick='del(${i})'>Delete</button></p>`).join('');let e=items.reduce((s,x)=>s+x.a,0);document.getElementById('exp').innerText=e;document.getElementById('bal').innerText=25000-e;}function add(){let t=document.getElementById('t').value,a=+document.getElementById('a').value,c=document.getElementById('c').value;if(!t||!a)return;items.push({t,a,c});render();}function del(i){items.splice(i,1);render();}render();</script></body></html>
